<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>大肥鱼</title>
<style>
:root{
 --bg:#0a0a0c;--side:#0e0e11;--panel:#131317;--panel2:#17171c;--line:#232329;--line2:#2c2c34;
 --fg:#ededf0;--sub:#8a8a96;--dim:#5c5c68;--acc:#6f7bf7;--acc2:#8b5cf6;--ok:#34d399;--warn:#fbbf24;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13.5px/1.65 -apple-system,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:212px 1fr;height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:20px}
.logo{display:flex;align-items:center;gap:9px;padding:0 6px}
.logo .mark{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 14px rgba(111,123,247,.35)}
.logo b{font-size:13.5px;font-weight:600;letter-spacing:.2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--sub);text-decoration:none;cursor:pointer;font-size:13px;transition:.12s}
.nav a:hover{background:#16161b;color:var(--fg)}
.nav a.on{background:linear-gradient(90deg,rgba(111,123,247,.16),rgba(139,92,246,.08));color:#dfe2ff;box-shadow:inset 0 0 0 1px rgba(111,123,247,.22)}
.nav .ico{width:15px;text-align:center;opacity:.9}
.side .foot{margin-top:auto;font-size:11.5px;color:var(--dim);line-height:1.7;padding:0 8px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}
.dot.on{background:var(--ok);box-shadow:0 0 8px rgba(52,211,153,.6)}
.dot.off{background:var(--dim)}
.main{display:flex;flex-direction:column;min-width:0}
.top{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 20px;background:rgba(10,10,12,.7);backdrop-filter:blur(8px)}
.top h1{font-size:14px;font-weight:600;margin:0}
.top .meta{margin-left:auto;display:flex;gap:14px;font-size:12px;color:var(--sub)}
.pill{padding:2px 9px;border-radius:99px;background:var(--panel2);border:1px solid var(--line)}
.body{padding:20px;overflow:auto;display:none}.body.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card .hd{padding:11px 15px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--sub);display:flex;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 15px;font-size:13px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{color:var(--dim);font-weight:500;font-size:11.5px;letter-spacing:.3px;text-transform:uppercase}
tbody tr{cursor:pointer;transition:.1s}
tbody tr:hover{background:#16161b}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11.5px;background:#1b1b22;border:1px solid var(--line2);color:var(--sub)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--dim)}
.muted{color:var(--sub)}
.msg{padding:12px 16px;border-bottom:1px solid var(--line)}
.msg:last-child{border-bottom:0}
.msg .h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.msg .who{font-size:12px;font-weight:600;color:#c8ccff}
.msg .who.me{color:#9ae6b4}
.msg .t{font-size:11.5px;color:var(--dim)}
.msg .x{color:#d6d6de;word-break:break-word}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;padding:15px}
.tool{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;transition:.12s}
.tool:hover{border-color:var(--line2);transform:translateY(-1px)}
.tool .en{font-size:10.5px;color:var(--muted,#8b93a7);opacity:.7;display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tool .nm{font-size:12.5px;font-family:ui-monospace,Consolas,monospace;color:#c9c9d4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{width:30px;height:17px;border-radius:99px;background:#2a2a33;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#6b6b78;transition:.15s}
.sw.on{background:rgba(52,211,153,.25);box-shadow:inset 0 0 0 1px rgba(52,211,153,.35)}
.sw.on::after{left:15px;background:var(--ok)}
.empty{padding:40px;text-align:center;color:var(--dim)}
.inp{background:var(--panel2);border:1px solid var(--line2);color:var(--fg);border-radius:8px;padding:7px 10px;font-size:13px;outline:none}
.inp:focus{border-color:var(--acc)}
.btn{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#fff;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.del{background:#1b1b22;border:1px solid var(--line2);color:#ff8f8f;border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer}
</style>
<style id="ASTR_THEME">
:root{
  --bg:#f4f5f7; --side:#ffffff; --panel:#ffffff; --panel2:#fbfbfc;
  --line:#e3e6ea; --line2:#d6dae4;
  --fg:#1f2329; --sub:#6b7280; --dim:#9aa1ad;
  --acc:#3b82f6; --acc2:#6366f1; --ok:#16a34a;
}
html,body{background:var(--bg)!important;color:var(--fg)!important}
.side{background:#fff!important;border-right:1px solid var(--line)!important;padding:16px 10px!important}
.nav a{color:var(--sub)!important;border-radius:8px!important;padding:9px 11px!important;font-size:13.5px!important}
.nav a:hover{background:#f0f2f5!important;color:var(--fg)!important}
.nav a.on{background:#e8f0fe!important;color:var(--acc)!important;font-weight:600;box-shadow:none!important}
.body{padding:20px!important}
.card{background:#fff!important;border:1px solid var(--line)!important;border-radius:10px!important;
  box-shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04)!important}
.card .hd{padding:12px 16px!important;border-bottom:1px solid var(--line)!important;
  font-weight:600!important;font-size:13.5px!important;color:var(--fg)!important}
.grid{gap:14px!important;padding:16px!important;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))!important}
.tool{background:#fbfbfc!important;border:1px solid var(--line)!important;border-radius:10px!important;padding:14px!important}
.tool:hover{border-color:var(--acc)!important;box-shadow:0 2px 8px rgba(59,130,246,.10)!important}
.tool .nm{color:var(--fg)!important;font-weight:600!important}
.tool .en{color:var(--dim)!important}
.sw{background:#d7dbe2!important;width:34px!important;height:20px!important}
.sw::after{width:16px!important;height:16px!important;background:#fff!important}
.sw.on{background:var(--acc)!important}
.sw.on::after{left:16px!important;background:#fff!important}
.btn{background:var(--acc)!important;color:#fff!important;border:0!important;border-radius:8px!important;padding:8px 14px!important;font-size:13px!important}
input,select,textarea{background:#fff!important;color:var(--fg)!important;border:1px solid var(--line2)!important;border-radius:8px!important;padding:7px 10px!important}
input:focus,select:focus{outline:none;border-color:var(--acc)!important;box-shadow:0 0 0 3px rgba(59,130,246,.12)}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--sub)!important;font-weight:600!important;font-size:12px!important;
  padding:10px 16px!important;border-bottom:1px solid var(--line)!important;background:#fafbfc!important}
td{padding:11px 16px!important;border-bottom:1px solid var(--line)!important;font-size:13px!important;color:var(--fg)!important}
tr:hover td{background:#fafbfe}
.muted{color:var(--sub)!important}
.mono{color:var(--sub)!important}
/* 顶部工具条 */
#astrbar{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:12px;padding:0 20px;position:sticky;top:0;z-index:20;margin:-20px -20px 16px}
#astrbar h2{font-size:15px;margin:0;font-weight:600}
#astrbar .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);
  background:#f6f7f9;border:1px solid var(--line);border-radius:99px;padding:4px 10px}
#astrbar .dot{width:7px;height:7px;border-radius:99px;background:var(--ok)}
#astrbar .sp{flex:1}
/* 统计卡 */
.astr-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:16px}
.astr-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;
  box-shadow:0 1px 3px rgba(16,24,40,.06)}
.astr-card .k{font-size:12.5px;color:var(--sub)}
.astr-card .v{font-size:26px;font-weight:700;letter-spacing:-.5px;margin:4px 0 2px}
.astr-card .s{font-size:12px;color:var(--dim)}
/* 聊天分栏 */
.astr-chat{display:grid;grid-template-columns:230px 1fr;min-height:440px;background:#fff;
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
.astr-chat .cl{border-right:1px solid var(--line);background:#fbfbfc;overflow:auto}
.astr-chat .ci{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.astr-chat .ci:hover{background:#f4f6fa}
.astr-chat .ci.on{background:#e8f0fe}
.astr-chat .ci b{font-weight:600;display:block;margin-bottom:2px}
.astr-chat .ci span{font-size:11.5px;color:var(--dim)}
.astr-chat .cm{padding:16px;display:flex;flex-direction:column;gap:10px;overflow:auto;max-height:520px}
.astr-bub{max-width:72%;padding:9px 13px;border-radius:12px;font-size:13.5px;line-height:1.55;white-space:pre-wrap}
.astr-bub.them{background:#f1f3f6;align-self:flex-start;border-top-left-radius:4px}
.astr-bub.me{background:var(--acc);color:#fff;align-self:flex-end;border-top-right-radius:4px}
</style>

<style id="ASTR_MEM2_CSS">
html.dark{
  --bg:#0f1115; --side:#15181e; --panel:#15181e; --panel2:#1a1d24;
  --line:#262a33; --line2:#333845; --fg:#e6e8ec; --sub:#9aa1ad; --dim:#6b7280;
}
html.dark body{background:#0f1115!important;color:#e6e8ec!important}
html.dark .side{background:#15181e!important;border-right-color:#262a33!important}
html.dark .card,html.dark .astr-card,html.dark .astr-chat{background:#15181e!important;border-color:#262a33!important}
html.dark .card .hd{border-bottom-color:#262a33!important;color:#e6e8ec!important}
html.dark #astrbar{background:#15181e!important;border-bottom-color:#262a33!important}
html.dark #astrbar h2{color:#e6e8ec}
html.dark .astr-chat .cl{background:#1a1d24!important;border-right-color:#262a33!important}
html.dark .astr-chat .ci.on{background:#1e2a44!important}
html.dark .astr-bub.them{background:#242832!important;color:#e6e8ec}
html.dark input,html.dark select,html.dark textarea{background:#1a1d24!important;color:#e6e8ec!important;border-color:#333845!important}
html.dark th{background:#1a1d24!important;color:#9aa1ad!important;border-bottom-color:#262a33!important}
html.dark td{border-bottom-color:#262a33!important;color:#e6e8ec!important}
html.dark tr:hover td{background:#1c2028!important}
html.dark .tool{background:#1a1d24!important;border-color:#262a33!important}
html.dark .tool .nm{color:#e6e8ec!important}
#themeBtn{position:fixed;right:16px;bottom:16px;z-index:99;width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:18px;
  box-shadow:0 2px 10px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center}
</style>

<style id="astr-plugin-css">
.astr-plugins{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.astr-plugin{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 1px 3px rgba(16,24,40,.06);overflow:hidden;cursor:pointer;transition:.15s;
  display:flex;flex-direction:column}
.astr-plugin:hover{border-color:var(--acc);box-shadow:0 4px 14px rgba(59,130,246,.12)}
.astr-plugin .ph{display:flex;align-items:center;gap:12px;padding:14px 16px 10px}
.astr-plugin .ico{width:36px;height:36px;border-radius:9px;background:#eef2ff;display:flex;
  align-items:center;justify-content:center;font-size:18px}
.astr-plugin .tt{flex:1;min-width:0}
.astr-plugin .tt b{display:block;font-size:14px;color:var(--fg)}
.astr-plugin .tt span{display:block;font-size:12px;color:var(--sub);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.astr-plugin .st{font-size:11.5px;padding:2px 9px;border-radius:99px;white-space:nowrap}
.astr-plugin .st.on{background:#e8f7ee;color:#15803d}
.astr-plugin .st.off{background:#f3f4f6;color:#6b7280}
.astr-plugin .pb{padding:0 16px 12px;font-size:12px;color:var(--sub);min-height:20px}
.astr-plugin .pf{padding:10px 16px 14px;border-top:1px solid var(--line);text-align:right}
html.dark .astr-plugin .ico{background:#1e2a44}
html.dark .astr-plugin .st.off{background:#242832;color:#9aa1ad}
</style>
</head><body>
<div class="app">
  <aside class="side">
    <div class="logo"><div class="mark"></div><b>大肥鱼</b></div>
    <nav class="nav">
      <a data-t="dash" class="on"><span class="ico">▦</span>总览</a>
      <a data-t="sessions"><span class="ico">◈</span>会话</a>
      <a data-t="messages"><span class="ico">≡</span>消息</a>
      <a data-t="tools"><span class="ico">⚙</span>功能</a>
      <a data-t="snow"><span class="ico">☁</span>网关</a>
      <a data-t="persona"><span class="ico">☺</span>人设</a>
      <a data-t="allow"><span class="ico">＋</span>白名单</a>
      <a data-t="black"><span class="ico">⊘</span>黑名单</a>
      <a data-t="tasks"><span class="ico">▷</span>任务</a>
      <a data-t="logs"><span class="ico">⌘</span>日志</a>
      <a data-t="memory"><span class="ico">◇</span>记忆</a>
      <a data-t="rel"><span class="ico">♥</span>关系</a>
    </nav>
    <div class="foot" id="foot">连接中…</div>
  </aside>
  <div class="main">
    <div class="top">
      <h1 id="title">会话</h1>
      <div class="meta">
        <span class="pill" id="m-conn">● 桥接</span>
        <span class="pill" id="m-mood">情绪 —</span>
        <span class="pill" id="m-allow">白名单 0</span>
      </div>
    </div>
    <div class="body on" id="dash"></div>
    <div class="body" id="sessions"></div>
    <div class="body" id="messages"></div>
    <div class="body" id="snow"></div>
  <div class="body" id="persona"></div>
  <div class="body" id="tools"></div>
    <div class="body" id="allow"></div>
    <div class="body" id="black"></div>
    <div class="body" id="tasks"></div>
    <div class="body" id="logs"></div>
    <div class="body" id="memory"></div>
    <div class="body" id="rel"></div>
  </div>
</div>
<script>
let current=null;
const $=id=>document.getElementById(id);
function hl(s,q){ if(!q) return s; try { return s.split(esc(q)).join('<mark style="background:#3b3b12;color:#ffe58a;border-radius:3px;padding:0 2px">'+esc(q)+'</mark>'); } catch(e){ return s; } }
const esc=s=>String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const fmt=t=>t?new Date(t).toLocaleString('zh-CN',{hour12:false}):'—';
async function j(u){const r=await fetch(u);return r.json()}
async function overview(){
  try{
    const o=await j('/api/overview');
    const conn=!!(o.bridge&&o.bridge.snowluma&&o.bridge.snowluma.connected);
    $('m-conn').textContent=(conn?'● 已连接':'○ 未连接');
    $('m-conn').style.color=conn?'var(--ok)':'var(--dim)';
    $('m-mood').textContent='情绪 '+(o.mood&&o.mood.label||'—');
    $('m-allow').textContent='白名单 '+((o.allow&&o.allow.groups||[]).length);
    $('foot').innerHTML='<span class="dot '+(conn?'on':'off')+'"></span>QQ '+(conn?'在线':'离线')+'<br><span class="dot '+(o.bridge&&o.bridge.dshReady?'on':'off')+'"></span>DSH '+(o.bridge&&o.bridge.dshReady?'就绪':'未就绪');
  }catch(e){$('foot').textContent='连接失败'}
}
async function loadSessions(){
  const rows=await j('/api/sessions');
  $('sessions').innerHTML= rows.length?('<div class="card"><div class="hd">'+rows.length+' 个会话</div><table><thead><tr><th>名称</th><th>标识</th><th>条数</th><th>最后活动</th></tr></thead><tbody>'+
    rows.map(r=>'<tr data-k="'+esc(r.key)+'"><td>'+esc(r.label)+'</td><td class="mono">'+esc(r.key)+'</td><td>'+r.count+'</td><td class="muted">'+fmt(r.lastAt)+'</td></tr>').join('')+
    '</tbody></table></div>'):'<div class="card empty">还没有会话</div>';
  $('sessions').querySelectorAll('tr[data-k]').forEach(tr=>tr.onclick=()=>{current=tr.dataset.k;go('messages')});
}
async function loadMessages(q){
  const qs=(q===undefined?(window.__msgQ||''):q);
  window.__msgQ=qs;
  const lim=window.__msgLimit||200;
  const date=window.__msgDate||'';
  const data=await j('/api/messages?'+(current?'key='+encodeURIComponent(current)+'&':'')+'q='+encodeURIComponent(qs)+'&date='+encodeURIComponent(date)+'&limit='+lim);
  const rows=data.rows||[];
  window.__msgTotal=data.total||0;
  const bar='<div class="card" style="margin-bottom:12px"><div style="padding:12px;display:flex;gap:8px;flex-wrap:wrap">'+
    '<input id="m-q" class="inp" placeholder="搜索消息…" value="'+esc(qs)+'" style="flex:1;min-width:180px">'+
    '<input id="m-date" class="inp" type="date" value="'+esc(date)+'" title="按天筛选">'+
    '<button id="m-go" class="btn">搜索</button>'+
    (current?('<input id="m-send" class="inp" placeholder="以她的身份发一条到 '+esc(current)+'" style="flex:2;min-width:220px"><button id="m-sendbtn" class="btn">发送</button>'):'')+
    '</div></div>';
  $('messages').innerHTML=bar+'<div class="card"><div class="hd">'+(current?'当前会话 '+esc(current):'全部')+' · 最近 200 条</div>'+
    (rows.length?rows.map(r=>'<div class="msg"><div class="h"><span class="who'+(r.who==='bot'?' me':'')+'">'+(r.who==='bot'?'她':esc(r.name||'对方'))+'</span><span class="t">'+esc(r.date)+'</span></div><div class="x">'+hl(esc(r.text),qs)+'</div></div>').join(''):'<div class="empty">没有消息</div>')+
    (rows.length?('<div style="padding:10px 15px;text-align:center"><button id="m-more" class="btn" style="opacity:'+(rows.length>=window.__msgTotal?'.4':'1')+'">加载更多（'+rows.length+'/'+window.__msgTotal+'）</button></div>'):'')+
    '</div>';
    if($('m-more')) $('m-more').onclick=()=>{window.__msgLimit=(window.__msgLimit||200)+200;loadMessages();};
    $('m-date').onchange=()=>{window.__msgDate=$('m-date').value;window.__msgLimit=200;loadMessages();};
    $('m-go').onclick=()=>{window.__msgLimit=200;loadMessages($('m-q').value)};
    $('m-q').onkeydown=(e)=>{if(e.key==='Enter')loadMessages($('m-q').value)};
    if($('m-sendbtn')){
      $('m-sendbtn').onclick=async()=>{
        const text=$('m-send').value.trim(); if(!text) return;
        $('m-sendbtn').textContent='发送中…';
        const r=await fetch('/api/send',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({key:current,text})});
        const o=await r.json();
        $('m-sendbtn').textContent='发送';
        if(o.ok){$('m-send').value='';loadMessages();} else alert(o.error||'发送失败');
      };
    }

}
async function toggleTool(el){
  const flag=el.dataset.flag, on=el.querySelector('.sw').classList.contains('on');
  el.style.opacity=.5;
  const r=await fetch('/api/tools',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({flag,enabled:!on})});
  const o=await r.json();
  el.style.opacity=1;
  if(o.ok){ el.querySelector('.sw').classList.toggle('on',o.enabled); }
  else alert(o.error||'失败');
}
  const TOOL_NAMES = {
    getPrompt:'读人设/推荐值', getUnread:'看未读', getRecent:'看最近消息', getMyRecent:'看自己说过啥',
    getMessageDetail:'看单条详情', getActiveMembers:'看活跃成员', getMessageImages:'看图/表情',

  let featureCache = null;

  async function loadFeatures(){
    const d = await j('/api/features');

  async function featToggle(ev, sw){
    ev.stopPropagation();
    const id = sw.dataset.toggle;
    const next = sw.dataset.on !== '1';
    const r = await fetch('/api/feature-toggle', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id, on: next }),
    });
    const d = await r.json();
    if (!d.ok) { alert(d.error || '切换失败'); return; }
    sw.dataset.on = next ? '1' : '0';
    sw.classList.toggle('on', next);
  }
  function renderFeatureList(){
    const box = $('tools');
    const cards = featureCache.map(f => {
      const on = f.enabled !== false;   // 每张卡用自己的开关字段
      const nums = f.fields.filter(x => x.type === 'number').slice(0, 2)
        .map(x => esc(x.label) + ' ' + esc(String(x.value))).join(' · ');
      return '<div class="astr-plugin" data-cat="' + esc(f.id) + '">' +
        '<div class="ph">' +
          '<div class="ico">' + esc(f.icon || '🧩') + '</div>' +
          '<div class="tt"><b>' + esc(f.name) + '</b><span>' + esc(f.desc || '') + '</span></div>' +
          '<span class="sw ' + (on ? 'on' : '') + '" data-toggle="' + esc(f.id) + '" data-on="' + (on ? '1' : '0') + '" style="cursor:pointer"></span>' +
        '</div>' +

        '<div class="pf"><button class="btn">配置</button></div>' +
      '</div>';
    }).join('');

    box.innerHTML =
      '<div id="astrbar"><h2>功能</h2><span class="chip">' + featureCache.length + ' 个模块</span>' +
      '<div class="sp"></div><button class="btn" id="featRefresh">刷新</button></div>' +
      '<div class="astr-plugins">' + cards + '</div>';

    $('featRefresh').onclick = loadFeatures;
    box.querySelectorAll('[data-cat]').forEach(el => { el.onclick = () => openFeature(el.dataset.cat); });
    box.querySelectorAll('[data-toggle]').forEach(sw => {
      sw.onclick = async (ev) => { featToggle(ev, sw); };
    });
  }

          '<div style="background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;max-width:520px">' +
            '<div style="font-weight:600;margin-bottom:10px;color:var(--fg)">新增模型</div>' +
            '<div style="display:flex;flex-direction:column;gap:8px">' +
              '<label class="muted" style="font-size:12px">模型名称（下拉里显示的名字）</label>' +
              '<input id="dmName" placeholder="例如 通义万相">' +
              '<label class="muted" style="font-size:12px">模型 ID（调用时用的名字）</label>' +
              '<input id="dmModel" placeholder="例如 wanx-v1">' +
              '<label class="muted" style="font-size:12px">API Key</label>' +

            '</div>' +

        '</div>' +

    $('dmCancel').onclick = () => { $('dmModal').style.display = 'none'; };
    $('dmSel').onchange = async (e) => {
      const r = await fetch('/api/image-models', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action: 'activate', name: e.target.value }),
      });
      const d = await r.json();
      if (!d.ok) return alert(d.error || '切换失败');
      renderDrawModels(root);
    };
    $('dmDel').onclick = async () => {
      const name = $('dmSel').value;
      if (!name || !confirm('删除模型「' + name + '」？')) return;
      const r = await fetch('/api/image-models', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action: 'delete', name }),
      });
      const d = await r.json();
      if (!d.ok) return alert(d.error || '删除失败');
      renderDrawModels(root);
    };
    $('dmSave').onclick = async () => {
      const name = $('dmName').value.trim();
      const model = $('dmModel').value.trim();
      const apiKey = $('dmKey').value.trim();
      if (!name || !model) { $('dmMsg').textContent = '名称和模型 ID 都要填'; return; }
      const r = await fetch('/api/image-models', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action: 'save', name, model, apiKey }),
      });
      const d = await r.json();
      if (!d.ok) { $('dmMsg').textContent = d.error || '保存失败'; return; }
      await fetch('/api/image-models', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action: 'activate', name }),
      });
      renderDrawModels(root);
    };
  }


  function openFeature(id){
    if (id === 'persona') { if (typeof openMood === 'function') return openMood(); }
    const f = featureCache.find(x => x.id === id);
    if (!f) return;
    const box = $('tools');
    let rows = '';
    for (const fd of f.fields) {
      const val = fd.value;
      if (fd.type === 'bool') {
        const on = val === true;
        rows += '<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)">' +
          '<span>' + esc(fd.label) + '</span>' +
          '<span class="sw ' + (on ? 'on' : '') + '" data-toggle="' + esc(fd.path) + '" data-val="' + (on ? '0' : '1') + '" style="cursor:pointer"></span>' +
        '</div>';
      } else if (fd.type === 'select') {
        rows += '<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)">' +
          '<span>' + esc(fd.label) + '</span>' +
          '<select data-sel="' + esc(fd.path) + '" style="background:#1b1b22;color:#ddd;border:1px solid var(--line);border-radius:6px;padding:4px 8px">' +
            fd.options.map(o => '<option value="' + esc(o) + '"' + (String(val) === o ? ' selected' : '') + '>' + esc(o) + '</option>').join('') +
          '</select></div>';
      } else {
        const type = fd.type === 'number' ? 'number' : 'text';
        const extra = fd.type === 'number'
          ? ' min="' + (fd.min !== undefined ? fd.min : '') + '" max="' + (fd.max !== undefined ? fd.max : '') + '" step="' + (fd.step || 1) + '"'
          : '';
        rows += '<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)">' +
          '<span>' + esc(fd.label) + '</span>' +
          '<input type="' + type + '"' + extra + ' data-num="' + esc(fd.path) + '" value="' + esc(String(val === '' ? '' : val)) + '" style="width:180px;background:#1b1b22;color:#ddd;border:1px solid var(--line);border-radius:6px;padding:5px 8px">' +
        '</div>';
      }
    }
    box.innerHTML = '<div class="card">' +
      '<div class="hd" style="display:flex;align-items:center;gap:10px">' +
        '<button id="featBack" class="btn">← 返回</button>' +
        '<span>' + esc(f.icon || '') + ' ' + esc(f.name) + '</span>' +
        '<span class="muted" style="font-size:12px">' + esc(f.desc || '') + '</span>' +
      '</div><div style="padding:6px 14px 16px">' +
      '<div class="muted" style="font-size:12px;padding:8px 0 12px;border-bottom:1px solid var(--line);margin-bottom:6px">' +
      esc(f.fields.filter(x => x.type === 'number').slice(0, 3).map(x => x.label + ' ' + String(x.value)).join(' · ') || '这项没有可调数字') +
      '</div>' + rows + '</div></div>';

    $('featBack').onclick = renderFeatureList;
    if (id === 'draw') { try { const _c = box.querySelector('.card'); const _d = document.createElement('div'); _c.appendChild(_d); renderDrawModels(_d); } catch { } }   // mountDrawModels

    box.querySelectorAll('[data-toggle]').forEach(el => {
      el.onclick = async () => {
        const r = await fetch('/api/features', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ path: el.dataset.toggle, value: el.dataset.val === '1' })
        });
        const d = await r.json();
        if (!d.ok) return alert(d.error || '保存失败');
        featureCache = d.categories;
        openFeature(id);
      };
    });
    box.querySelectorAll('[data-num]').forEach(el => {
      el.onchange = async () => {
        const r = await fetch('/api/features', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ path: el.dataset.num, value: el.value })
        });
        const d = await r.json();
        if (!d.ok) return alert(d.error || '保存失败');
        featureCache = d.categories;
        el.style.borderColor = '#3ddc84';
        setTimeout(() => { el.style.borderColor = ''; }, 800);
      };
    });
    box.querySelectorAll('[data-sel]').forEach(el => {
      el.onchange = async () => {
        const r = await fetch('/api/features', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ path: el.dataset.sel, value: el.value })
        });
        const d = await r.json();
        if (!d.ok) return alert(d.error || '保存失败');
        featureCache = d.categories;
      };
    });
  }

  $('tasks').innerHTML='<div class="card"><div class="hd">点歌任务 · 2 秒刷新 · 只显示正在跑的</div><table><thead><tr><th>歌名</th><th>模式</th><th>阶段</th><th>开始</th><th>结束</th><th>状态</th><th></th></tr></thead><tbody>'+
    (rows.length?rows.map(r=>'<tr><td>'+esc(r.song)+'</td><td>'+esc(r.mode)+'</td><td>'+esc(r.stage)+'</td><td class="muted">'+esc(r.start)+'</td><td class="muted">'+esc(r.end||'—')+'</td>'+
      '<td style="min-width:120px"><div style="background:#232329;border-radius:6px;height:6px;overflow:hidden"><div style="height:6px;width:'+(r.percent||0)+'%;background:linear-gradient(90deg,#6f7bf7,#8b5cf6)"></div></div><div class="muted" style="font-size:11px;margin-top:3px">'+(r.percent||0)+'% · 已跑 '+(r.elapsedMin||0)+' 分钟</div></td>'+
      '<td>'+(r.status==='running'?('<button class="del" data-cancel="1">终止</button>'):'')+'</td></tr>').join(''):'<tr><td colspan="6" class="empty">现在没有在跑的歌</td></tr>')+
    '</tbody></table></div>';
  $('tasks').querySelectorAll('[data-cancel]').forEach(b=>b.onclick=async(e)=>{
    e.stopPropagation();
    if(!confirm('终止正在跑的点歌？')) return;
    const r=await fetch('/api/sing-cancel',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});
    const o=await r.json().catch(()=>({}));
    if(!o.ok) alert(o.error||'取消失败：这个任务可能已经结束了');
    loadTasks();
  });
  clearTimeout(taskTimer); taskTimer=setTimeout(()=>{ if($('tasks').classList.contains('on')) loadTasks(); },2000);
}

async function loadRel(){
  const d=await j('/api/relations');
  const rows=d.relations||[];
  const color=(s)=>s>=75?'#34d399':s>=60?'#a3e635':s>=45?'#fbbf24':'#8b93a7';
  $('rel').innerHTML='<div class="card"><div class="hd">'+rows.length+' 个人 · 好感度（50 为基准）</div><table><thead><tr><th>人</th><th>QQ</th><th>好感</th><th>记录</th><th>最近</th></tr></thead><tbody>'+
    (rows.length?rows.map(r=>'<tr><td>'+esc(r.name)+'</td><td class="mono">'+esc(r.qq)+'</td>'+
      '<td style="color:'+color(r.score)+';font-weight:600">'+r.score+'</td><td>'+r.records+'</td>'+
      '<td class="muted">'+(r.recent.length?r.recent.map(x=>(x.delta>0?'+':'')+x.delta+' '+esc(x.why)).join('；'):'—')+'</td></tr>').join(''):'<tr><td colspan="5" class="empty">还没有档案</td></tr>')+
    '</tbody></table></div>';
}
function go(t){
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.t===t));
  ['dash','sessions','messages','snow','persona','tools','allow','black','tasks','logs','memory','rel'].forEach(s=>$(s).classList.toggle('on',s===t));
  $('title').textContent={dash:'总览',sessions:'会话',messages:'消息',snow:'网关',persona:'人设',tools:'功能',allow:'白名单',black:'黑名单',tasks:'任务',logs:'日志',memory:'记忆',rel:'关系'}[t];
  if(t==='dash')loadSummary();if(t==='sessions')loadSessions();if(t==='tasks')loadTasks();if(t==='logs')loadLogs();if(t==='memory')loadMemory();if(t==='rel')loadRel();if(t==='messages')loadMessages();if(t==='snow')loadSnow();if(t==='persona')loadPersona();if(t==='tools')loadFeatures();if(t==='allow')loadAllow();if(t==='black')loadBlack();
}
document.querySelectorAll('.nav a').forEach(a=>a.onclick=()=>go(a.dataset.t));
overview();loadSummary();loadSessions();setInterval(overview,10000);
</script>
<script id="ASTR_PAGES">
// ---- 总览 / 消息 的 AstrBot 风格重绘 ----
(function(){
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function bar(title, chips){
    const cs = (chips || []).map(c => '<span class="chip">' + (c.dot ? '<span class="dot"></span>' : '') + esc(c.t) + '</span>').join('');
    return '<div id="astrbar"><h2>' + esc(title) + '</h2>' + cs + '<div class="sp"></div>' +
           '<button class="btn" id="astrRefresh">刷新</button></div>';
  }

  async function renderDash(){
    const box = $('dash'); if (!box) return;
    let d = {};
    try { const r = await fetch('/api/overview'); d = await r.json(); } catch {}
    const up = d.up || {};
    let total = 0, sessions = 0;
    try {
      const s = await (await fetch('/api/sessions')).json();
      sessions = s.length;
      total = s.reduce((a, x) => a + (x.count || 0), 0);
    } catch {}

    const cards = [
      { k: '今日消息', v: total.toLocaleString(), s: '全部会话累计' },
      { k: '活跃会话', v: sessions, s: '白名单内' },
      { k: '服务', v: Object.values(up).filter(Boolean).length + '/' + Object.keys(up).length, s: '在线服务' },
      { k: '情绪', v: (d.mood && d.mood.label) || '平静', s: '强度 ' + ((d.mood && d.mood.intensity) || 0) },
    ].map(c => '<div class="astr-card"><div class="k">' + c.k + '</div><div class="v">' + esc(c.v) + '</div><div class="s">' + esc(c.s) + '</div></div>').join('');

    const rows = Object.entries(ups).map(([k, v]) =>
      '<div class="tool" style="padding:12px"><span class="nm">' + esc(k) + '</span>' +
      '<span class="en" style="color:' + (v ? '#16a34a' : '#ef4444') + '">' + (v ? '● 在线' : '● 离线') + '</span></div>').join('');

    box.innerHTML = bar('概览', [{ t: '运行中', dot: true }, { t: '会话 ' + sessions }]) +
      '<div class="astr-cards">' + cards + '</div>' +
      '<div class="card"><div class="hd">服务状态</div><div class="grid">' + rows + '</div></div>';

    $('astrRefresh').onclick = renderDash;
  }

  async function renderMsgs(){
    const box = $('messages'); if (!box) return;
    let list = [];
    try { list = await (await fetch('/api/sessions')).json(); } catch {}
    if (!list.length) { box.innerHTML = bar('消息', []) + '<div class="card"><div class="bd muted" style="padding:20px">没有会话</div></div>'; return; }
    const cur = renderMsgs._key || list[0].key;

    const items = list.map(x =>
      '<div class="ci' + (x.key === cur ? ' on' : '') + '" data-k="' + esc(x.key) + '">' +
        '<b>' + esc(x.label) + '</b><span>' + x.count + ' 条 · ' + (x.lastAt ? new Date(x.lastAt).toLocaleString('zh-CN', { hour12: false }) : '—') + '</span>' +
      '</div>').join('');

    let rows = [];
    try {
      const r = await (await fetch('/api/messages?key=' + encodeURIComponent(cur) + '&limit=80')).json();
      rows = (r.rows || []).slice().reverse();
    } catch {}
    const bubbles = rows.map(m =>
      '<div class="astr-bub ' + (m.who === 'bot' ? 'me' : 'them') + '">' +
        (m.who === 'bot' ? '' : '<b style="font-size:11.5px;color:#6b7280;display:block;margin-bottom:2px">' + esc(m.name || '') + '</b>') +
        esc(m.text) + '</div>').join('') || '<div class="muted" style="padding:12px">没有消息</div>';

    box.innerHTML = bar('消息', [{ t: list.length + ' 个会话' }]) +
      '<div class="astr-chat"><div class="cl">' + items + '</div><div class="cm">' + bubbles + '</div></div>';

    box.querySelectorAll('.ci').forEach(el => el.onclick = () => { renderMsgs._key = el.dataset.k; renderMsgs(); });
    $('astrRefresh').onclick = renderMsgs;
  }

  // 接管：原渲染完成后替换内容
  const watch = (id, fn) => {
    const el = document.getElementById(id);
    if (!el) return;
    let busy = false;
    new MutationObserver(() => {
      if (busy || el.dataset.astr) return;
      busy = true;
      el.dataset.astr = '1';
      fn().finally(() => { busy = false; setTimeout(() => { delete el.dataset.astr; }, 400); });
    }).observe(el, { childList: true });
  };
  window.addEventListener('load', () => { watch('messages', renderMsgs); });   // 总览交给原 loadSummary
})();
</script>

<script id="ASTR_MEM2">
(function(){
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // ── 深浅色切换 ──
  const btn = document.createElement('button');
  btn.id = 'themeBtn';
  btn.title = '切换深浅色';
  const saved = localStorage.getItem('astr-theme');
  if (saved === 'dark') { document.documentElement.classList.add('dark'); btn.textContent = '☀️'; }
  else btn.textContent = '🌙';
  btn.onclick = () => {
    const dark = document.documentElement.classList.toggle('dark');
    localStorage.setItem('astr-theme', dark ? 'dark' : 'light');
    btn.textContent = dark ? '☀️' : '🌙';
  };
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(btn));
  if (document.body) document.body.appendChild(btn);

  // ── 记忆面板：按 key 合并 + 按条数降序 ──
  async function renderMem(){
    const box = $('memory'); if (!box) return;
    let groups = [];
    try { groups = await (await fetch('/api/memory-groups')).json(); } catch (e) { return; }
    if (!Array.isArray(groups)) groups = [];
    groups.sort((a, b) => (b.count || 0) - (a.count || 0));
    const rows = groups.map(g =>
      '<tr><td>' + esc(g.label || g.key) + '</td>' +
      '<td class="mono" style="font-size:12px;color:var(--sub)">' + esc(g.key) + '</td>' +
      '<td><b>' + (g.count || 0) + '</b> 条</td>' +
      '<td class="muted" style="font-size:12px">' + (g.lastAt ? new Date(g.lastAt).toLocaleString('zh-CN', { hour12: false }) : '—') + '</td></tr>').join('') ||
      '<tr><td colspan="4" class="muted" style="padding:18px">没有数据</td></tr>';
    box.innerHTML =
      '<div id="astrbar"><h2>记忆</h2><span class="chip">' + groups.length + ' 个会话</span>' +
      '<div class="sp"></div><button class="btn" id="memRefresh">刷新</button></div>' +
      '<div class="card"><div class="hd">按聊天记录条数排序（多的在前）</div>' +
      '<table><tr><th>名称</th><th>会话 key</th><th>记录数</th><th>最后一条</th></tr>' + rows + '</table></div>';
    $('memRefresh').onclick = renderMem;
  }

  const watch = (id, fn) => {
    const el = document.getElementById(id);
    if (!el) return;
    let busy = false;
    new MutationObserver(() => {
      if (busy || el.dataset.astr) return;
      busy = true; el.dataset.astr = '1';
      fn().finally(() => { busy = false; setTimeout(() => { delete el.dataset.astr; }, 400); });
    }).observe(el, { childList: true });
  };
  window.addEventListener('load', () => watch('memory', renderMem));
})();
</script>

<script id="PERSONA_PAGE">
async function loadPersona(){

    '<div id="pMsg" class="muted" style="margin-top:8px;font-size:12px"></div>' +
    '</div></div>';

  $('pSave').onclick = async () => {
    const text = $('pText').value;
    $('pMsg').textContent = '保存中…';
    try {
      const r = await fetch('/api/persona', {
        method: 'POST', headers: { 'content-type': 'application/json' },

      $('pMsg').textContent = '✅ 已保存（' + d.bytes + ' 字节），下一条消息生效；备份 ' + (d.backup || '');
    } catch (e) { $('pMsg').textContent = '保存失败：' + e; }
  };
}
</script>
